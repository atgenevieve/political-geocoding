# District plans the pipeline builds.
#
# Every plan is a *block assignment*: a file that puts each 2020 Census
# tabulation block into one district. The pipeline joins any such file to
# 2020 block population and the block -> ZCTA relationship, so adding a new
# map (a new Congress, a court-ordered redraw, state legislative chambers,
# city council districts...) means adding a [[plan]] entry here and rerunning
# `python -m geocoding build`.
#
# Fields
#   id            stable identifier, used as the output folder name
#   layer         district type: congress | state_upper | state_lower | ...
#   name          human-readable description
#   source_url    zip (or txt) holding the block assignment file
#   source_page   where a human can verify the source
#   source_file   regex picking the file inside the zip ("" = largest .txt)
#   in_effect     date the districts start representing people
#   first_election  first election held on these lines
#   notes         free text, copied into the manifest

[[plan]]
id = "cd120"
layer = "congress"
name = "120th Congress (districts on the ballot Nov 3, 2026; seated Jan 3, 2027)"
source_url = "https://www2.census.gov/programs-surveys/decennial/rdo/mapping-files/2027/120-congressional-district-befs/cd120.zip"
source_page = "https://www.census.gov/geographies/mapping-files/2027/dec/rdo/120-congressional-district-bef.html"
source_file = "(?i)national"
in_effect = "2027-01-03"
first_election = "2026-11-03"
notes = """Census Bureau 120th Congressional District block equivalency file. \
Includes the 2025-26 mid-decade maps in AL, CA, FL, LA, NC, OH, TN, TX and UT. \
Missouri uses its 2022 plan (national file regenerated by Census on 2026-10-06 \
after the 2025 map was suspended by referendum). All other states unchanged."""

[[plan]]
id = "cd119"
layer = "congress"
name = "119th Congress (current members, Jan 3, 2025 - Jan 3, 2027)"
source_url = "https://www2.census.gov/programs-surveys/decennial/rdo/mapping-files/2025/119-congressional-district-befs/cd119.zip"
source_page = "https://www.census.gov/geographies/mapping-files/2025/dec/rdo/119-congressional-district-bef.html"
source_file = "(?i)national"
in_effect = "2025-01-03"
first_election = "2024-11-05"
notes = "Census Bureau 119th Congressional District block equivalency file."

# Which plan the Google Sheets function and the top-level lookup use when no
# plan is given. Move this forward when a new Congress is seated or a newer
# map takes effect.
[defaults]
congress = "cd120"
